<div class="viewer">
  <button class="close-button" (click)="close()">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
  </button>

  @if (displayContent) {
    <div
      class="image-wrapper"
      [class.dragging]="isDragging"
      (wheel)="onWheel($event)"
      (pointerdown)="startDrag($event)"
      (dblclick)="toggleZoom()"
    >
      <div class="zoom-layer" [style.transform]="transform">
        @if (isSvgContent) {
          <div class="svg-container" [innerHTML]="displayContent"></div>
        } @else {
          <img [src]="displayContent" alt="Viewed Image" draggable="false">
        }
      </div>
    </div>
    <div class="zoom-controls">
      <button type="button" (click)="zoomOut()" [title]="'viewer.zoomOut' | t">
        <span class="material-symbols-outlined">zoom_out</span>
      </button>
      <button type="button" class="zoom-percent" (click)="resetZoom()" [title]="'viewer.reset' | t">
        {{ zoomPercent }}%
      </button>
      <button type="button" (click)="zoomIn()" [title]="'viewer.zoomIn' | t">
        <span class="material-symbols-outlined">zoom_in</span>
      </button>
    </div>
  } @else {
    <div class="image-wrapper">
      <div class="no-image-placeholder">
        No image data provided.
      </div>
    </div>
  }
</div>
