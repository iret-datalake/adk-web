<!DOCTYPE html>
<html>
<head>
    <title>CORS Test Frontend</title>
</head>
<body>
    <h1>CORS Test Frontend</h1>
    <button onclick="fetchData()">Fetch Data from Cloud Run</button>
    <pre id="response"></pre>

    <script>
        const cloudRunServiceUrl = "https://backend-api-cors-test-74803432761.asia-northeast1.run.app"; // ★あなたのCloud RunサービスのURLに置き換える

        async function fetchData() {
            try {
                // credentials: "include" はIAPなどで認証情報（クッキーなど）を使う場合に必要
                const response = await fetch(`${cloudRunServiceUrl}/list-apps?relative_path=./`, {
                    method: 'GET',
                    credentials: 'include'
                });
                const data = await response.json();
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('response').textContent = `Error: ${error.message}`;
                console.error('Fetch error:', error);
            }
        }
    </script>
</body>
</html>
